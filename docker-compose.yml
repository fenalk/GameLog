name: gamelog

services:
  db:
    image: postgres:18-alpine
    container_name: gamelog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamelog}
      POSTGRES_DB: ${POSTGRES_DB:-gamelog}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - gamelog-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gamelog} -d ${POSTGRES_DB:-gamelog}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gamelog-db-data:
